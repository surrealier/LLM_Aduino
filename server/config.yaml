server:
  host: 0.0.0.0
  port: 5001
stt:
  model_size: medium
  device: cuda
  language: ko
llm:
  provider: gemini
  base_url: ''
  model: gemini-2.5-flash-lite
  ollama_model: qwen2.5:0.5b
  api_models:
    gemini: gemini-2.5-flash
    claude: claude-3-5-haiku-latest
    chatgpt: gpt-4o-mini
  priority:
  - ollama
  - api
  - ollama_cpu
  - other
  api_priority:
  - gemini
  - claude
  - chatgpt
  think: false
  auto_start: true
  start_command: ollama serve
  startup_timeout: 10.0
  response_max_tokens: 512
  greeting_max_tokens: 160
  retry_max_tokens: 1024
tts:
  backend: edge_tts
  voice: ko-KR-SunHiNeural
assistant:
  name: ccoli
  personality: witty
  proactive: true
  proactive_interval: 600
features:
  robot_mode_enabled: false
robot:
  servo:
    pin_pitch: 26
    pin_tilt: 32
    angle_min: 0
    angle_max: 180
    default_angle: 90
  display:
    type: ssd1306
    width: 128
    height: 64
    i2c_scl: 21
    i2c_sda: 25
    i2c_addr: '0x3C'
  idle:
    blink_interval_min: 3000
    blink_interval_max: 5000
    gaze_interval: 8000
  emotion:
    default: neutral
    decay_to_neutral: true
    decay_interval: 30
memory:
  refresh_interval: 5
  memory_dir: memory
weather:
  api_key: ''
  lat: 37.5665
  lon: 126.978
context:
  max_history: 20
  backup_interval: 10
  auto_save: true
emotion:
  enabled: true
  decay_to_neutral: true
  decay_interval: 300
logging:
  level: INFO
  save_to_file: true
  log_dir: logs
connection:
  mode: wired
  priority:
  - wired
  - wifi
  socket_timeout: 0.5
  serial_port: auto
  serial_baudrate: 115200
  serial_scan_interval: 1.0
  serial_initial_idle_timeout_s: 5.0
runtime:
  processor_priority:
  - gpu
  - cpu
queue:
  stt_maxsize: 4
  tts_maxsize: 2
  command_maxsize: 10
audio:
  max_seconds: 12
setup:
  install_target: api
  provider: gemini
  python_extras:
  - runtime
  connection_mode: wired
  server_port: 5001
web:
  enabled: true
  host: 0.0.0.0
  port: 8005
  auth_token: ''
  log_tail_lines: 200
