[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccoli"
version = "0.1.0"
description = "ccoli CLI for running and configuring the ccoli voice robot stack"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.7.1",
]

[project.optional-dependencies]
runtime = [
  "faster-whisper>=0.10.0",
  "numpy>=1.24.0",
  "edge-tts>=6.1.0",
  "fastapi>=0.111.0",
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "requests>=2.31.0",
  "feedparser>=6.0.10",
  "python-dotenv>=1.0.0",
  "pyserial>=3.5",
  "uvicorn[standard]>=0.29.0",
]
test = [
  "pytest>=7.0.0",
]
dev = [
  "faster-whisper>=0.10.0",
  "numpy>=1.24.0",
  "edge-tts>=6.1.0",
  "fastapi>=0.111.0",
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "requests>=2.31.0",
  "feedparser>=6.0.10",
  "python-dotenv>=1.0.0",
  "pyserial>=3.5",
  "pytest>=7.0.0",
  "uvicorn[standard]>=0.29.0",
]

[project.scripts]
ccoli = "ccoli.cli:main"
colli = "ccoli.cli:main"

[tool.setuptools]
packages = ["ccoli"]


[tool.pytest.ini_options]
markers = [
  "telegram: telegram channel tests",
  "channel: channel integration tests",
  "protocol: protocol regression tests"
]
